[versions]
androidGradlePlugin = "8.5.0"
flexbox = "3.0.0"
kotlin = "2.0.21"  # 保持与插件版本一致
room = "2.6.1"      # 升级Room到稳定版本

[libraries]
# Android核心
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.10.1" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.6.1" }
flexbox = { module = "com.google.android.flexbox:flexbox", version.ref = "flexbox" }
material = { group = "com.google.android.material", name = "material", version = "1.12.0" }

# UI组件
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version = "2.2.0" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version = "1.3.2" }
cardview = { group = "androidx.cardview", name = "cardview", version = "1.0.0" }

# 架构组件
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version = "1.9.2" }
fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version = "1.8.3" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version = "2.8.5" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version = "2.8.5" }
lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version = "2.8.5" }

# Room数据库
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# 其他
gson = { group = "com.google.code.gson", name = "gson", version = "2.10.1" } # 升级到2.10+

# 测试
junit = { group = "junit", name = "junit", version = "4.13.2" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version = "1.1.5" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version = "3.5.1" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }